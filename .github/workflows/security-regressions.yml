name: Security regressions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-ai.txt pillow numpy uv pip-audit
      - run: python -m pip check
      - run: python -m pytest backend/tests/test_security_regressions.py backend/tests/test_biomedparse_demo.py backend/tests/test_clinical_platform.py backend/tests/test_ai_live.py backend/tests/test_ai_text.py backend/tests/test_ai_codex.py backend/tests/test_ai_codex_exploration.py backend/tests/test_ai_actions.py backend/tests/test_ai_exploration_contracts.py backend/tests/test_ai_exploration_coverage.py backend/tests/test_ai_exploration_routes.py backend/tests/test_ai_exploration_lifecycle.py backend/tests/test_ai_exploration_tools.py backend/tests/test_ai_research.py backend/tests/test_ai_providers.py backend/tests/test_ai_openai.py backend/tests/test_ai_connection_races.py backend/tests/test_ai_screen_awareness.py backend/tests/test_ai_credentials.py backend/tests/test_ai_research_settings.py backend/tests/test_ai_evidence_review.py backend/tests/test_ai_evidence_routes.py backend/tests/test_ai_evidence_provenance.py backend/tests/evidence_review -q
      - name: Resolve and audit research dependencies
        run: |
          uv pip compile --python 3.12 backend/requirements.txt -o /tmp/radsysx-research.txt
          pip-audit -r /tmp/radsysx-research.txt --no-deps --disable-pip
      - run: pip-audit -r backend/requirements-ai.txt

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm audit
      - run: npx prisma generate --schema frontend/schema.prisma
      - run: npm run type-check
      - run: npm run build
      - run: npm run audit:ohif --workspace viewer
      - run: npm run test:fhir-bridge --workspace viewer
      - run: npm run test:security --workspace viewer
      - run: npm run test:live --workspace viewer
      - run: npm run desktop:test:live
